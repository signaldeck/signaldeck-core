name: Central script runner tests

on:
  pull_request:
  push:
    branches:
      - feature/dynamic-script-schedules

jobs:
  script-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install framework dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "signaldeck-sdk @ git+https://github.com/signaldeck/signaldeck-sdk.git@47105617f2ac71acecd3bb4f2d94f79389fab456" "signaldeck-ui @ git+https://github.com/signaldeck/signaldeck-ui.git@v1.1.beta.1"
          python -m pip install -e .
      - name: Test multi-worker queue and schedules
        run: python -m unittest discover -s tests -v
